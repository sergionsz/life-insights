# Production deployment: Caddy terminates TLS, the sync server and Postgres stay on an internal
# network, and a sidecar takes a daily dump of the database.
#
# Run from the repository root on the server:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# The local docker-compose.yml at the repository root is a different thing: plain HTTP on port
# 8080, no certificates, for trying this on a laptop. Do not deploy that one.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: insights
    volumes:
      - db-data:/var/lib/postgresql/data
    # No ports section on purpose. Postgres is reachable only from the other containers on this
    # compose network, never from the internet, whatever the host firewall happens to allow.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights -d insights"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://insights:${POSTGRES_PASSWORD}@db:5432/insights
      SYNC_TOKEN: ${SYNC_TOKEN:?set SYNC_TOKEN in deploy/.env}
      PORT: 8080
    ports:
      # Bound to loopback, so `curl localhost:8080/health` works when you are on the box and
      # nothing outside it can reach the server except through Caddy.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy-data holds the certificates and the ACME account key. It has to persist: without it
      # every restart asks Let's Encrypt for a fresh certificate, and five of those for the same
      # name in a week hits the rate limit and leaves the server without TLS for days.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - server

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # A dump immediately on start, then once a day. Fourteen kept, which is enough to notice and
    # undo a mistake but not enough to fill the boot volume.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          if pg_dump -h db -U insights -d insights | gzip > /backups/insights-$$stamp.sql.gz; then
            echo "backup written: insights-$$stamp.sql.gz"
          else
            echo "BACKUP FAILED at $$stamp" >&2
            rm -f /backups/insights-$$stamp.sql.gz
          fi
          find /backups -name 'insights-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
